services:
  chassette:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: chassette:latest
    container_name: chassette
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Git auto-update: the container clones this repo and redeploys on every new commit.
      GIT_REPO: ${GIT_REPO:-}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_POLL_SECONDS: ${GIT_POLL_SECONDS:-60}
      # Optional: instant redeploy via POST /api/hook (GitHub/GitLab webhook secret).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-10}
      ITEMS_PER_SOURCE: ${ITEMS_PER_SOURCE:-2}
      MAX_AGE_HOURS: ${MAX_AGE_HOURS:-72}
    volumes:
      - chassette-live:/srv/chassette
      # Station timelines survive restarts/redeploys so live listeners stay in sync.
      - chassette-data:/srv/data

volumes:
  chassette-live:
  chassette-data:
